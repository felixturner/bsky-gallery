<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bluesky 3D Gallery — spike</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="status">Loading…</div>
    <div id="overlay">
      <div class="panel">
        <h1>Bluesky 3D</h1>
        <p>click to engage</p>
        <p class="hint">WASD / arrows to move · mouse to look · shift to sprint · click image to load full · ESC to release</p>
      </div>
    </div>
    <div id="reticle"></div>
    <div id="info"><span id="count">0</span> items</div>
    <div id="esc-hint">ESC to release</div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
