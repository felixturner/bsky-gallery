<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bluesky 3D Gallery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&display=swap" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="overlay">
      <div class="panel">
        <h1>Bluesky 3D Gallery</h1>
        <form id="form">
          <input id="handle" type="text" placeholder="bluesky handle" autocomplete="off" autofocus />
          <button type="submit">Go</button>
        </form>
        <p id="overlay-status"></p>
        <div id="engage-prompt" hidden>
          <p class="cta">click to enter</p>
          <p class="hint">WASD / arrows to move · mouse to look · shift to sprint · click image to load full · ESC to release</p>
        </div>
      </div>
    </div>
    <div id="reticle" hidden></div>
    <div id="info" hidden><span id="count">0</span> items</div>
    <div id="esc-hint" hidden>ESC to release</div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
