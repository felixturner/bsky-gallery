<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bluesky Art Gallery</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&display=swap" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="overlay">
        <h1><svg id="bsky-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M6.335 4.212c2.293 1.76 4.76 5.327 5.665 7.241.906-1.914 3.372-5.482 5.665-7.241C19.319 2.942 22 1.96 22 5.086c0 .624-.35 5.244-.556 5.994-.713 2.608-3.315 3.273-5.629 2.87 4.045.704 5.074 3.035 2.852 5.366-4.22 4.426-6.066-1.111-6.54-2.53-.086-.26-.126-.382-.127-.278 0-.104-.041.018-.128.278-.473 1.419-2.318 6.956-6.539 2.53-2.222-2.331-1.193-4.662 2.852-5.366-2.314.403-4.916-.262-5.63-2.87C2.35 10.33 2 5.71 2 5.086c0-3.126 2.68-2.144 4.335-.874Z"/></svg>Bluesky Art Gallery</h1>
        <form id="form">
          <label for="handle" id="handle-label">Enter a Bluesky handle, feed or list URL</label>
          <input id="handle" type="text" autocomplete="off" autofocus />
          <button type="submit">Go</button>
        </form>
        <label id="reposts-row">
          <input type="checkbox" id="reposts" checked />
          Show Reposts
        </label>
        <p id="overlay-status"></p>
        <div id="engage-prompt" hidden>
          <p id="gallery-name"></p>
          <p class="cta">Click to Enter</p>
          <p class="hint">WASD / arrows to move · mouse to look · ESC to release</p>
        </div>
    </div>
    <div id="reticle" hidden></div>
    <div id="info" hidden><span id="count">0</span> items</div>
    <div id="esc-hint" hidden>ESC to release</div>
    <div id="nav-controls" hidden>
      <button id="nav-prev" aria-label="Previous artwork">‹</button>
      <button id="nav-next" aria-label="Next artwork">›</button>
    </div>
    <div id="look-joystick" hidden aria-label="Look around">
      <div id="look-thumb"></div>
    </div>
    <div id="tap-hint" hidden>tap a picture to walk to it · drag to look</div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
