<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bluesky Media Gallery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&display=swap" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header>
      <h1>Bluesky Media Gallery</h1>
      <form id="form">
        <input id="handle" type="text" placeholder="bluesky handle" data-default="felixturner.bsky.social" autocomplete="off" />
        <button type="submit">Go</button>
      </form>
      <div class="footer-row">
        <label class="check-label">
          <input type="checkbox" id="reposts" checked />
          <span class="check-icon">
            <svg class="check-off" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect width="18" height="18" x="3" y="3" rx="2"/>
            </svg>
            <svg class="check-on" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect width="18" height="18" x="3" y="3" rx="2"/>
              <path d="m9 12 2 2 4-4"/>
            </svg>
          </span>
          Show Reposts
        </label>
        <span class="credit">Built by <a href="https://airtight.cc" target="_blank" rel="noopener">Airtight</a></span>
        <a class="source-link" href="https://github.com/felixturner/bsky-gallery" target="_blank" rel="noopener" aria-label="View source on GitHub">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.4 5.4 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/>
            <path d="M9 18c-4.51 2-5-2-7-2"/>
          </svg>
        </a>
      </div>
      <div id="toggles">
        <label><input type="checkbox" id="external" /> external embeds</label>
        <label><input type="checkbox" id="linked" /> linked media</label>
        <label><input type="checkbox" id="masonry-layout" checked /> L→R masonry</label>
      </div>
    </header>
    <div id="spinner" hidden><div class="ring"></div></div>
    <main id="feed">
      <div class="grid-sizer"></div>
      <div class="gutter-sizer"></div>
    </main>
    <footer>
      <div id="more"></div>
      <div id="status"></div>
    </footer>
    <div id="lightbox" hidden>
      <button id="lightbox-close" aria-label="Close">
        <svg viewBox="0 0 24 24" width="27" height="27" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
      <div id="lightbox-content"></div>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
