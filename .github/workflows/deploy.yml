name: Deploy gallery to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build 2D gallery
        working-directory: gallery2d
        run: |
          npm ci
          npm run build

      - name: Build 3D gallery
        working-directory: gallery3d
        run: |
          npm ci
          npm run build

      - name: Combine builds
        run: |
          mkdir -p dist
          cp -r gallery2d/dist/. dist/
          mkdir -p dist/3d
          cp -r gallery3d/dist/. dist/3d/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
